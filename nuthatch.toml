# ---------------------------------------------------------------------------
# Group 2: the org's governance modules.
#
# OrgDeployer.OrgDeployed announces all ten in a single event, one address per named param.
# They CANNOT be expressed as ten [[factories]] rules: nuthatch keys factory rules by
# `{watch}__{event}`, so ten rules on org_deployer__org_deployed would collide and only the
# last would survive. They also cannot share one template — five event *names* in this system
# carry two different signatures (VoteCast, Winner, PauseSet, OrgRegistered, BatchExecuted),
# and tables are named per event *name*, so a shared template would produce two decoders
# fighting over one table.
#
# One org exists on this deployment (orgId 0xa71879ef…, block 447060036), so its modules are
# pinned directly. Each gets its own alias, hence its own clean table namespace —
# hybrid_voting__vote_cast and dd_voting__vote_cast stay separate, which is the whole point.
# When a second org deploys, run `nuthatch add` with its module addresses.
# ---------------------------------------------------------------------------

[[contracts]]
alias = "executor"
address = "0xb1ff2bd0231770ccc91801aa1fae4b3226e1fe41"
start_block = 447060036
abi = "abis/executor.json"

