# ---------------------------------------------------------------------------
# The one genuine factory in the system.
#
# Every module is fronted by a SwitchableBeacon, minted per module and announced by
# OrgRegistry.ContractRegistered(contractId, orgId, typeId, proxy, beacon, autoUpgrade, owner).
# One event, one child type, N children — the shape nuthatch factories are actually for. This
# also keeps working for orgs deployed after this nest was written: their beacons get picked
# up with no config change.
# ---------------------------------------------------------------------------

[[templates]]
name = "switchable_beacon"
abi = "abis/switchable_beacon.json"

[[factories]]
watch = "org_registry"
event = "ContractRegistered"
child_param = "beacon"
template = "switchable_beacon"
start = 447060027
