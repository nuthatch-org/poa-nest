[nest]
name = "poa"
chain = "arbitrum-one"
chain_id = 42161
# A usable endpoint here must do BOTH a wide eth_getLogs (this nest backfills 42.8M blocks at
# --window 50000) and JSON-RPC batches >3 (the block-timestamp fetcher), over archive history
# back to block 447059849. Measured on the free public endpoints, not assumed:
#   arb1.arbitrum.io            getLogs 50k OK, batch OK, but rate-limits into partial
#                               timestamp responses near the tip (retries recover)
#   arbitrum-one.public.blastapi.io / 1rpc.io/arb   getLogs capped   (timestamp fallback only)
#   arbitrum.drpc.org           batch capped at 3 on the free plan — timestamps never complete
#   arb-pokt.nodies.app         403 on getLogs
#
# These public endpoints work but are slow and flaky. Override with your own archive node:
#   nuthatch dev --dir . --seal-direct --window 50000 --concurrency 8 --rpc https://your-node/
# `--rpc` is tried first and keeps these as fallback, so the private URL never enters the repo.
rpc_urls = [
    "https://arb1.arbitrum.io/rpc",
    "https://arbitrum-one.public.blastapi.io",
]
schema_version = 1

# Parity target: subgraph QmVPhLwuv9zn2c761Ua7eJAFXBmrNsW32XUYsj1GKtNX4X (arbitrum-one).
# ABIs are the exact ones pinned by that manifest, fetched from IPFS — not Sourcify. Every
# module here is a beacon proxy, so Sourcify/Etherscan would hand back the proxy ABI, which
# has none of the real events.
#
# The subgraph declares 6 static dataSources + 19 ethereum templates. Most of those templates
# are *singletons* discovered from one-shot events, which is why they are static contracts
# here — see the two groups below. Event allowlists are omitted deliberately: nuthatch decodes
# every event in each ABI, so this nest is a strict superset of the subgraph's event coverage.

# ---------------------------------------------------------------------------
# Group 1: protocol infrastructure.
#
# PoaManager/GovernanceFactory/PoaManagerHub/Hats/PoaDKIMRegistry are static in the subgraph
# too. The next four (org_deployer, org_registry, paymaster_hub, account_registry) are
# *templates* in the subgraph, spawned by PoaManager.InfrastructureDeployed — but that event
# fires exactly once, at block 447060027, so their addresses are knowable ahead of time and
# pinning them costs nothing. Verified on-chain:
#   InfrastructureDeployed(orgDeployer, orgRegistry, implRegistry,
#                          paymasterHub, globalAccountRegistry, passkeyAccountFactoryBeacon)
# ---------------------------------------------------------------------------

[[contracts]]
alias = "poa_manager"
address = "0xff585fae4a944cd173b19158c6fc5e08980b0815"
start_block = 447059849
abi = "abis/poa_manager.json"

