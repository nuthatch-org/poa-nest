# semantic.toml - what this nest's data *means* (RFC-0016). Read by the MCP `schema`
# tool, the admin UI, and the scaffolded skill. Edit descriptions freely; the
# `[table.*.footguns]` are DERIVED from the ABI and regenerated - leave them be.

schema_version = 1

[nest]
description = """
POA — a DAO-tooling stack on Arbitrum One: an org deployer that mints a full governance suite
(two voting modules, a task manager, an education hub, a participation token, a payment manager)
per organisation, with roles carried by Hats Protocol and gas sponsored by a paymaster hub.

Parity target: subgraph QmVPhLwuv9zn2c761Ua7eJAFXBmrNsW32XUYsj1GKtNX4X.

Scale note before you write a query: this deployment has exactly ONE org (orgId
0xa71879ef0e38b15fe7080196c0102f859e0ca8e7b8c0703ec8df03c66befd069, deployed at block 447060036)
and ~850 events in total across ~43M blocks. Every table here is tiny. If a query returns
thousands of rows, you have made a cartesian join, not a discovery.
"""

